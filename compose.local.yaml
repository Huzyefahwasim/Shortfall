services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortfall
      POSTGRES_USER: shortfall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shortfall_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortfall -d shortfall"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  shortfall_local:
