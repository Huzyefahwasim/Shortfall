#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/shortfall
  - chmod 700 /opt/shortfall
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - touch /opt/shortfall/bootstrap-ready
